    <style>
        /* ── Theme definitions ───────────────────────────────────────── */
        .theme-2025 {
            --splash-bg-a: #102b6a;
            --splash-bg-b: #0e2660;
            --splash-bg-radial: #1a3d8a;
            --splash-text: #ffffff;
            --splash-svg-fill: #ffffff;
        }

        .theme-2026 {
            --splash-bg-a: #fff8e5;
            --splash-bg-b: #fdf3d8;
            --splash-bg-radial: #fffdf5;
            --splash-text: #3b2d00;
            --splash-svg-fill: #3b2d00;
        }

        .theme-2027 {
            --splash-bg-a: #0f3c3d;
            --splash-bg-b: #0d3536;
            --splash-bg-radial: #174f50;
            --splash-text: #f0f7f4;
            --splash-svg-fill: #f0f7f4;
        }

        /* ── Reset ───────────────────────────────────────────────────── */
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ── Splash loader ───────────────────────────────────────────── */
        #initial-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(80% 110% at 10% 10%, var(--splash-bg-radial), var(--splash-bg-b)),
            linear-gradient(135deg, var(--splash-bg-a), var(--splash-bg-b));
            background-attachment: fixed;
            color: var(--splash-text);
            z-index: 9999;
        }

        .logo {
            width: 180px;
            height: 180px;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .logo svg path {
            fill: var(--splash-svg-fill);
        }

        .loading {
            margin-top: 24px;
            font-size: 1.3rem;
            animation: fade 2s ease-in-out infinite;
        }

        @keyframes fade {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        #initial-loader.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease-out;
            pointer-events: none;
        }
    </style>
</head>

        const bgMap = {
            'theme-2025': '#0b234f',
            'theme-2026': '#fef7dc',
            'theme-2027': '#0a2f31',

        const bg = bgMap[theme];

        document.documentElement.classList.add(theme);
        document.body.style.backgroundColor = bg;

        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
    })();
</script>
