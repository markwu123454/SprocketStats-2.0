[build-system]
# >=77 for PEP 639 SPDX `license` support.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprocketstats"
version = "0.1.0"
description = "SprocketStats"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]==0.136.1",
    "starlette==1.0.0",
    "uvicorn[standard]==0.47.0",
    "asyncpg==0.31.0",
    "Authlib==1.7.2",
    "python-jose[cryptography]==3.5.0",
    "httpx==0.28.1",
    "certifi==2026.4.22",
    "itsdangerous==2.2.0",
    "cryptography==48.0.0",
    "pywebpush==2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
# `auto` lets plain `async def test_*` run without a per-test decorator.
asyncio_mode = "auto"
# Pin the async-fixture loop scope now; pytest-asyncio will make this a hard
# default in a future release, so setting it avoids a behavior change later.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Put the backend root on sys.path so tests can `import db`, `import main`, etc.
pythonpath = ["."]
