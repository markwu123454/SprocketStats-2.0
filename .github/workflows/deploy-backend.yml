name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: File incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const commitMessage = context.payload.head_commit ? context.payload.head_commit.message : '';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] Backend deploy failed (${sha})`,
              labels: ['incident'],
              assignees: [context.actor],
              body: [
                '## Commit / PR that caused it',
                `Commit ${sha} — "${commitMessage}"`,
                commitUrl,
                '',
                `**Failed run:** ${runUrl}`,
                '',
                '## Cause',
                '_fill in what broke and why_',
                '',
                '## Fix',
                '_fill in what was done to resolve it_',
                '',
                '## Prevention (optional)',
                '_how to avoid this next time_',
              ].join('\n'),
            });