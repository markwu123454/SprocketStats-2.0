name: Deploy Frontend to Vercel
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        working-directory: ./frontend
        run: |
          npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/deploy.log
          grep -o 'https://vercel.com/[^[:space:]]*BX[^[:space:]]*' /tmp/deploy.log | head -1 > /tmp/inspect_url.txt || true
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Fetch full build logs on failure
        if: failure()
        working-directory: ./frontend
        run: |
          INSPECT_URL=$(cat /tmp/inspect_url.txt)
          echo "Inspect URL: $INSPECT_URL"
          npx vercel logs "$INSPECT_URL" --token=${{ secrets.VERCEL_TOKEN }} 2>&1
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: File incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const commitMessage = context.payload.head_commit ? context.payload.head_commit.message : '';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] Frontend deploy failed (${sha})`,
              labels: ['incident'],
              assignees: [context.actor],
              body: [
                '## Commit / PR that caused it',
                `Commit ${sha} — "${commitMessage}"`,
                commitUrl,
                '',
                `**Failed run:** ${runUrl}`,
                '',
                '## Cause',
                '_fill in what broke and why_',
                '',
                '## Fix',
                '_fill in what was done to resolve it_',
                '',
                '## Prevention (optional)',
                '_how to avoid this next time_',
              ].join('\n'),
            });
